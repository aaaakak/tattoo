{% comment %}
Designed empty state. Contract: marker, message, cta_label, cta_url
{% endcomment %}
<div class="empty-state" style="grid-column: 1 / -1">
  <p class="meta">{{ marker|default:"// 000 — NOTHING HERE YET" }}</p>
  <p class="body-prose">{{ message|default:"Content published from the admin appears here." }}</p>
  {% if cta_label and cta_url %}
    <a class="btn btn--primary" href="{{ cta_url }}">{{ cta_label }}</a>
  {% endif %}
</div>
